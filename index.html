<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuits, Switches & Real-Life Examples Lab</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p.subtitle { color: #9ca3af; margin-top: 0; margin-bottom: 25px; }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .circuit-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            width: 320px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: left;
        }
        h3 { color: #38bdf8; margin-top: 0; font-size: 15px; text-align: center; }
        canvas {
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px solid #475569;
            margin-bottom: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .meter-display {
            background-color: #090d16;
            border: 1px solid #22c55e;
            color: #22c55e;
            font-family: monospace;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 8px;
            min-height: 70px;
        }
        .real-life {
            font-size: 11px;
            color: #fbbf24;
            background: #292524;
            padding: 6px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .btn-group {
            display: flex;
            gap: 5px;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 7px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #2563eb; }
        .btn-switch {
            background-color: #ef4444;
        }
        .btn-switch.closed {
            background-color: #22c55e;
        }
    </style>
</head>
<body>

    <h1>⚡ Circuits, Switches & Real-Life Lab</h1>
    <p class="subtitle">Test series vs. parallel setups, toggle switches, and watch how electrons react!</p>

    <div class="container" id="circuit-container"></div>

    <script>
        const circuits = [
            { 
                id: 1, 
                name: "1. Series Circuit Example", 
                type: "Series", 
                cells: 2, 
                voltage: 12, 
                resistance: 4, 
                switchClosed: true,
                realLife: "💡 **Real-Life Example:** Old Christmas tree string lights. If one bulb burns out (opens the circuit), the whole string goes dark!"
            },
            { 
                id: 2, 
                name: "2. Parallel Circuit Example", 
                type: "Parallel", 
                cells: 2, 
                voltage: 12, 
                resistance: 4, 
                switchClosed: true,
                realLife: "💡 **Real-Life Example:** House wall outlets. If you turn off one lamp, the other lamps in the room stay on because they have separate paths."
            },
            { 
                id: 3, 
                name: "3. Switch Control Lab", 
                type: "Standard", 
                cells: 1, 
                voltage: 15, 
                resistance: 5, 
                switchClosed: false,
                realLife: "🔋 **Concept:** Click the green/red switch button to open or close the loop and see electrons start or stop moving instantly."
            }
        ];

        let circuitStats = {};
        let electrons = {};

        const container = document.getElementById("circuit-container");

        circuits.forEach(circ => {
            circuitStats[circ.id] = { time: 0, charge: 0 };
            
            electrons[circ.id] = [];
            for(let i=0; i<5; i++) {
                electrons[circ.id].push({ pos: i * 55 });
            }

            const card = document.createElement("div");
            card.className = "circuit-card";
            card.innerHTML = `
                <h3>${circ.name}</h3>
                <canvas id="canvas-${circ.id}" width="280" height="90"></canvas>
                <div class="real-life">${circ.realLife}</div>
                <div class="meter-display" id="meter-${circ.id}">Loading...</div>
                <div class="btn-group">
                    <button class="btn" onclick="boostBattery(${circ.id})">🔋 Boost (+V)</button>
                    <button class="btn btn-switch ${circ.switchClosed ? 'closed' : ''}" id="btn-switch-${circ.id}" onclick="toggleSwitch(${circ.id})">Switch: ${circ.switchClosed ? 'CLOSED' : 'OPEN'}</button>
                </div>
            `;
            container.appendChild(card);
        });

        function boostBattery(id) {
            const circ = circuits.find(c => c.id === id);
            circ.voltage += 3;
            if (circ.voltage > 30) circ.voltage = 9;
        }

        function toggleSwitch(id) {
            const circ = circuits.find(c => c.id === id);
            circ.switchClosed = !circ.switchClosed;
            
            const btn = document.getElementById(`btn-switch-${id}`);
            if (circ.switchClosed) {
                btn.className = "btn btn-switch closed";
                btn.innerText = "Switch: CLOSED";
            } else {
                btn.className = "btn btn-switch";
                btn.innerText = "Switch: OPEN";
            }
        }

        let lastTime = performance.now();

        function updateSimulation(currentTime) {
            const dt = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            circuits.forEach(circ => {
                const stats = circuitStats[circ.id];
                
                // If switch is OPEN, current is 0 and time stops accumulating charge
                let effectiveVoltage = circ.switchClosed ? circ.voltage : 0;
                let current = circ.switchClosed ? (effectiveVoltage / circ.resistance) : 0;
                
                if (circ.switchClosed) {
                    stats.time += dt;
                    stats.charge = current * stats.time;
                }

                // Update text metrics
                const meterBox = document.getElementById(`meter-${circ.id}`);
                if (!circ.switchClosed) {
                    meterBox.innerHTML = `[STATUS: CIRCUIT OPEN ❌]<br>• Path: Broken / Interrupted<br>• Current (Intensity): <b>0.00 A</b><br>• Electrons: <b>Stopped (No Flow)</b>`;
                } else {
                    meterBox.innerHTML = `[STATUS: CIRCUIT CLOSED ✅]<br>• Voltage: ${effectiveVoltage.toFixed(1)} V | Current: <b>${current.toFixed(2)} A</b><br>• Resistance: ${circ.resistance} Ω<br>• Total Charge (Q): ${stats.charge.toFixed(2)} C`;
                }

                // Render Canvas & Electrons
                const canvas = document.getElementById(`canvas-${circ.id}`);
                const ctx = canvas.getContext("2d");
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw Circuit Wire Path
                ctx.strokeStyle = circ.switchClosed ? "#475569" : "#7f1d1d"; // Red tint if open wire
                ctx.lineWidth = 3;
                ctx.strokeRect(15, 10, 250, 70);

                // Draw Switch Graphic Gap on top wire if open
                if (!circ.switchClosed) {
                    ctx.fillStyle = "#0f172a";
                    ctx.fillRect(120, 7, 40, 6); // Break the wire visually
                    ctx.fillStyle = "#ef4444";
                    ctx.font = "10px sans-serif";
                    ctx.fillText("SWITCH OPEN", 105, 5);
                } else {
                    ctx.fillStyle = "#22c55e";
                    ctx.font = "10px sans-serif";
                    ctx.fillText("SWITCH CLOSED", 102, 5);
                }

                // Draw Battery & Resistor
                ctx.fillStyle = "#ef4444";
                ctx.fillRect(20, 30, 12, 30);
                ctx.fillStyle = "#38bdf8";
                ctx.fillRect(250, 30, 12, 30);

                // Animate electrons only if circuit is closed
                const perimeter = 640;
                const speed = circ.switchClosed ? (current * 25) : 0; // Speed is 0 if open

                ctx.fillStyle = circ.switchClosed ? "#22c55e" : "#64748b"; // Gray out electrons if stopped
                electrons[circ.id].forEach(el => {
                    if (circ.switchClosed) {
                        el.pos = (el.pos + speed * dt) % perimeter;
                    }
                    
                    let x = 0, y = 0;
                    let p = el.pos;
                    if (p < 250) { x = 15 + p; y = 10; }
                    else if (p < 280) { x = 265; y = 10 + (p - 250); }
                    else if (p < 530) { x = 265 - (p - 280); y = 80; }
                    else { x = 15; y = 80 - (p - 530); }

                    ctx.beginPath();
                    ctx.arc(x, y, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                });
            });

            requestAnimationFrame(updateSimulation);
        }

        requestAnimationFrame(updateSimulation);
    </script>

</body>
</html>
